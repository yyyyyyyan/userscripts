<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>open shadow roots</title>
  </head>
  <body>
    <h1>open shadow roots</h1>
    <div id="early">
      <template shadowrootmode="open">
        <style>
          p {
            background: rgb(255, 255, 255);
          }
          @media (prefers-color-scheme: dark) {
            p {
              background: rgb(0, 0, 0);
            }
          }
        </style>
        <p>declared in the page</p>
      </template>
    </div>
    <div id="late"></div>
  </body>
</html>
