<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>early theme check</title>
    <script>
      document.documentElement.dataset.scheme = matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    </script>
    <!-- the test server pauses here -->
    <style>
      body {
        background: rgb(255, 255, 255);
      }
      :root[data-scheme='dark'] body {
        background: rgb(0, 0, 0);
      }
    </style>
  </head>
  <body>
    <h1>early theme check</h1>
  </body>
</html>
