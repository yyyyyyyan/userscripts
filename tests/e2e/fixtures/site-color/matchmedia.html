<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>matchMedia</title>
  </head>
  <body>
    <h1>matchMedia</h1>
    <script>
      // The manager can inject after a fast local page has already fired load.
      setTimeout(() => {
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.style.background = dark ? 'rgb(0, 0, 0)' : 'rgb(255, 255, 255)';
        document.body.dataset.scheme = dark ? 'dark' : 'light';
      }, 500);
    </script>
  </body>
</html>
