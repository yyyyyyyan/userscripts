<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>media rule</title>
    <style>
      body {
        background: rgb(255, 255, 255);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: rgb(0, 0, 0);
        }
      }
    </style>
  </head>
  <body>
    <h1>media rule</h1>
  </body>
</html>
